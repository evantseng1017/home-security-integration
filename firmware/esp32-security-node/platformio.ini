[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags =
    -std=gnu++17
build_unflags =
    -std=gnu++11

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
