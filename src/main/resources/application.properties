spring.application.name=home-security
spring.datasource.url=jdbc:h2:mem:securitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.deserialization.fail-on-unknown-properties=true

# TAK output is opt-in. Plain TCP is useful for a local mock receiver; use TLS and
# PKCS#12 client/trust stores with a real TAK Server.
tak.enabled=false
tak.host=localhost
tak.port=8087
tak.tls=false
tak.connect-timeout=5s
tak.stale-after=5m
tak.batch-size=25
tak.retry-interval=1000
# tak.key-store=C:/path/to/client.p12
# tak.key-store-password=change-me
# tak.trust-store=C:/path/to/truststore.p12
# tak.trust-store-password=change-me
